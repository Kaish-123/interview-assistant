<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechyEra - Telegram Marketing Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --dark: #0f172a; --darker: #020617; --card: #1e293b; --border: #334155; --text: #f1f5f9; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--darker); color: var(--text); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 20px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
        .header h1 { font-size: 24px; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-badge.connected { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-badge.disconnected { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-card h3 { font-size: 28px; margin-bottom: 4px; }
        .stat-card p { color: var(--text-muted); font-size: 13px; }
        .stat-card.primary h3 { color: var(--primary); }
        .stat-card.success h3 { color: var(--success); }
        .stat-card.warning h3 { color: var(--warning); }
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .card-header h2 { font-size: 16px; }
        .card-body { padding: 20px; }
        .btn { padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 13px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .group-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--dark); border-radius: 8px; margin-bottom: 8px; }
        .group-item .info { flex: 1; }
        .group-item .name { font-weight: 500; font-size: 14px; }
        .group-item .username { color: var(--text-muted); font-size: 12px; }
        .toggle { position: relative; width: 44px; height: 24px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--border); border-radius: 24px; transition: 0.3s; }
        .toggle-slider:before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        .toggle input:checked + .toggle-slider { background: var(--success); }
        .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
        .activity-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
        .activity-item:last-child { border-bottom: none; }
        .activity-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .activity-icon.success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .activity-icon.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .activity-info { flex: 1; }
        .activity-action { font-weight: 500; font-size: 13px; }
        .activity-details { color: var(--text-muted); font-size: 12px; }
        .activity-time { color: var(--text-muted); font-size: 11px; }
        .next-send { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .next-send .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        .next-send .time { font-size: 28px; font-weight: 700; margin-top: 4px; }
        .form-control { width: 100%; padding: 10px 14px; background: var(--dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
        .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fab fa-telegram"></i> TechyEra Marketing</h1>
            <div>
                <span class="status-badge" id="connectionStatus">Checking...</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card primary">
                <h3 id="messagesSent">0</h3>
                <p>Messages Sent Today</p>
            </div>
            <div class="stat-card success">
                <h3 id="groupsReached">0</h3>
                <p>Groups Reached</p>
            </div>
            <div class="stat-card">
                <h3 id="totalGroups">0</h3>
                <p>Total Groups</p>
            </div>
            <div class="stat-card warning">
                <h3 id="errorsToday">0</h3>
                <p>Errors Today</p>
            </div>
        </div>

        <div class="quick-actions">
            <button class="btn btn-primary" onclick="sendNow()"><i class="fas fa-paper-plane"></i> Send Now</button>
            <button class="btn btn-outline" onclick="loadGroups()"><i class="fas fa-sync"></i> Refresh</button>
        </div>

        <div class="main-grid">
            <div>
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-users"></i> Target Groups</h2>
                        <span id="groupCount">0 groups</span>
                    </div>
                    <div class="card-body" id="groupsList">
                        <div class="empty-state">Loading...</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-comment"></i> Marketing Message</h2>
                    </div>
                    <div class="card-body" id="messagePreview">
                        <div class="empty-state">Loading...</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="next-send">
                    <div class="label">Next Auto-Send</div>
                    <div class="time" id="nextSendTime">--:--</div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-cog"></i> Auto-Send</h2>
                        <label class="toggle">
                            <input type="checkbox" id="autoSendToggle" onchange="toggleAutoSend()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>Interval (minutes)</label>
                            <input type="number" class="form-control" id="sendInterval" value="30" min="5">
                        </div>
                        <div class="form-group">
                            <label>Delay between groups (seconds)</label>
                            <input type="number" class="form-control" id="sendDelay" value="4" min="1">
                        </div>
                        <button class="btn btn-outline" style="width:100%" onclick="saveSettings()">
                            <i class="fas fa-save"></i> Save Settings
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-history"></i> Activity Log</h2>
                    </div>
                    <div class="card-body" id="activityLog" style="max-height: 300px; overflow-y: auto;">
                        <div class="empty-state">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        
        async function loadStatus() {
            try {
                const res = await fetch(`${API}/api/status`);
                const data = await res.json();
                
                const badge = document.getElementById('connectionStatus');
                if (data.telegram_connected && data.telegram_authorized) {
                    badge.textContent = '● Connected';
                    badge.className = 'status-badge connected';
                } else {
                    badge.textContent = '● Disconnected';
                    badge.className = 'status-badge disconnected';
                }
                
                document.getElementById('messagesSent').textContent = data.stats.messages_sent_today;
                document.getElementById('groupsReached').textContent = data.stats.groups_reached_today;
                document.getElementById('totalGroups').textContent = data.total_groups;
                document.getElementById('errorsToday').textContent = data.stats.errors_today;
                document.getElementById('autoSendToggle').checked = data.auto_send_enabled;
                
                if (data.stats.next_send_time) {
                    const time = new Date(data.stats.next_send_time).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                    document.getElementById('nextSendTime').textContent = time;
                } else {
                    document.getElementById('nextSendTime').textContent = 'Disabled';
                }
            } catch (e) { console.error('Failed to load status:', e); }
        }
        
        async function loadGroups() {
            try {
                const res = await fetch(`${API}/api/groups`);
                const groups = await res.json();
                
                document.getElementById('groupCount').textContent = `${groups.length} groups`;
                
                if (groups.length === 0) {
                    document.getElementById('groupsList').innerHTML = '<div class="empty-state">No groups added yet</div>';
                    return;
                }
                
                document.getElementById('groupsList').innerHTML = groups.map(g => `
                    <div class="group-item">
                        <div class="info">
                            <div class="name">${g.name || g.username}</div>
                            <div class="username">${g.username}</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" ${g.enabled !== false ? 'checked' : ''} onchange="toggleGroup('${g.username}')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                `).join('');
            } catch (e) { console.error('Failed to load groups:', e); }
        }
        
        async function loadMessages() {
            try {
                const res = await fetch(`${API}/api/messages`);
                const messages = await res.json();
                
                if (messages.length === 0) {
                    document.getElementById('messagePreview').innerHTML = '<div class="empty-state">No message configured</div>';
                    return;
                }
                
                const msg = messages[0];
                document.getElementById('messagePreview').innerHTML = `
                    <div style="background: var(--dark); padding: 16px; border-radius: 8px; white-space: pre-wrap; font-size: 13px; max-height: 200px; overflow-y: auto;">
                        ${msg.text.substring(0, 500)}${msg.text.length > 500 ? '...' : ''}
                    </div>
                `;
            } catch (e) { console.error('Failed to load messages:', e); }
        }
        
        async function loadActivity() {
            try {
                const res = await fetch(`${API}/api/activity`);
                const activities = await res.json();
                
                if (activities.length === 0) {
                    document.getElementById('activityLog').innerHTML = '<div class="empty-state">No activity yet</div>';
                    return;
                }
                
                document.getElementById('activityLog').innerHTML = activities.slice(0, 20).map(a => `
                    <div class="activity-item">
                        <div class="activity-icon ${a.status === 'error' ? 'error' : 'success'}">
                            <i class="fas fa-${a.status === 'error' ? 'times' : 'check'}"></i>
                        </div>
                        <div class="activity-info">
                            <div class="activity-action">${a.action}</div>
                            <div class="activity-details">${a.details.substring(0, 50)}</div>
                        </div>
                        <div class="activity-time">${a.timestamp.split(' ')[1]}</div>
                    </div>
                `).join('');
            } catch (e) { console.error('Failed to load activity:', e); }
        }
        
        async function loadSettings() {
            try {
                const res = await fetch(`${API}/api/settings`);
                const settings = await res.json();
                document.getElementById('sendInterval').value = settings.send_interval_minutes || 30;
                document.getElementById('sendDelay').value = settings.delay_between_groups_seconds || 4;
            } catch (e) { console.error('Failed to load settings:', e); }
        }
        
        async function toggleGroup(username) {
            try {
                await fetch(`${API}/api/groups/${encodeURIComponent(username)}/toggle`, { method: 'PUT' });
            } catch (e) { console.error('Failed to toggle group:', e); }
        }
        
        async function toggleAutoSend() {
            const enabled = document.getElementById('autoSendToggle').checked;
            try {
                const endpoint = enabled ? '/api/auto-send/start' : '/api/auto-send/stop';
                await fetch(`${API}${endpoint}`, { method: 'POST' });
                loadStatus();
            } catch (e) { console.error('Failed to toggle auto-send:', e); }
        }
        
        async function saveSettings() {
            try {
                await fetch(`${API}/api/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        send_interval_minutes: parseInt(document.getElementById('sendInterval').value),
                        delay_between_groups_seconds: parseInt(document.getElementById('sendDelay').value)
                    })
                });
                alert('Settings saved!');
                loadStatus();
            } catch (e) { alert('Failed to save settings'); }
        }
        
        async function sendNow() {
            try {
                const res = await fetch(`${API}/api/send/now`, { method: 'POST' });
                if (res.ok) {
                    alert('Sending started! Check activity log.');
                    loadActivity();
                } else {
                    const data = await res.json();
                    alert('Error: ' + (data.detail || 'Unknown error'));
                }
            } catch (e) { alert('Failed to send: ' + e.message); }
        }
        
        // Load everything on page load
        loadStatus();
        loadGroups();
        loadMessages();
        loadActivity();
        loadSettings();
        
        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadStatus();
            loadActivity();
        }, 10000);
    </script>
</body>
</html>
